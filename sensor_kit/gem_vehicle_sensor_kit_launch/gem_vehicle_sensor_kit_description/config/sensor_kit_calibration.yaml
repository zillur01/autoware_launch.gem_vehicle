# Source: gem_description/urdf/e4/gem_e4.urdf.xacro, cross-checked against /tf_static of
# rosbag2_2026_11_06-16_32_19 (both agree). That model's origin is the middle of the wheelbase,
# 0.268 m above ground, so translations are shifted by x + 1.2904, z + 0.268; rotations are unchanged.
# Camera *_link frames are x-forward; the macro adds the optical frame with rpy (-pi/2, 0, -pi/2),
# the same as the original model.
