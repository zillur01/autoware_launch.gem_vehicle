# GEM e4 side mirrors relative to base_link (rear axle center on the ground), measured from
# gem_description/meshes/e4/base_link.STL. Kept in sync with
# gem_vehicle_sensor_kit_launch/config/crop_box_filter_mirror.param.yaml.
/**:
  ros__parameters:
    min_longitudinal_offset: 2.25
    max_longitudinal_offset: 2.39
    min_lateral_offset: -0.91
    max_lateral_offset: 0.91
    min_height_offset: 1.19
    max_height_offset: 1.35
